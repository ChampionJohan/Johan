<text class="mono t3" x="48" y="950" font-size="11.5">수익 5흐름 — 캠프 수수료 · 한국어 플랫폼 구독 · 미국 캠프 송출 · 프랜차이즈 연회비 · 교재비 (+ 교사 양성 과정)</text>
<text class="mono t3" x="48" y="972" font-size="11.5">⚠️ 말레이시아 프랜차이즈법(1998) — 가맹비가 없어도 등록 의무 대상일 수 있다. MyFEX 2.0 등록 검토 필수</text>
