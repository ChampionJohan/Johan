<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-label="학원지원센터 플랫폼 구조도">
<style>
svg{
  --paper:#F6F5F1; --sf:#FFFFFF; --sf2:#ECEFF4;
  --ink:#16202E; --ink2:#3A4657; --muted:#6A7585; --line:#D5DAE2; --line2:#BFC6D1;
  --acc:#1B3A6B; --accs:#E6EBF3; --on-acc:#FFFFFF;
  --gold:#9C6E16; --golds:#F6EDDC;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  svg:root, :root:not([data-theme="light"]) svg{
    --paper:#0E1218; --sf:#161C25; --sf2:#1D2531;
    --ink:#E6EAF0; --ink2:#C2CAD6; --muted:#8D97A6; --line:#28313D; --line2:#39434F;
    --acc:#6E9FD8; --accs:#152233; --on-acc:#0E1218;
    --gold:#C9972F; --golds:#2A2314;
  }
}
:root[data-theme="dark"] svg{
  --paper:#0E1218; --sf:#161C25; --sf2:#1D2531;
  --ink:#E6EAF0; --ink2:#C2CAD6; --muted:#8D97A6; --line:#28313D; --line2:#39434F;
  --acc:#6E9FD8; --accs:#152233; --on-acc:#0E1218;
  --gold:#C9972F; --golds:#2A2314;
}
.bg{fill:var(--paper)} .sf{fill:var(--sf)} .sf2{fill:var(--sf2)} .accs{fill:var(--accs)}
.ln{stroke:var(--line);fill:none} .ln2{stroke:var(--line2);fill:none}
.t1{fill:var(--ink)} .t2{fill:var(--ink2)} .t3{fill:var(--muted)}
.acc{fill:var(--acc)} .gold{fill:var(--gold)} .onacc{fill:var(--on-acc)}
.sacc{stroke:var(--acc);fill:none}
.eb{font-size:11.5px;letter-spacing:.14em;fill:var(--muted);font-family:'JetBrains Mono',ui-monospace,monospace}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.ser{font-family:'Noto Serif KR',Georgia,serif;font-weight:700}
</style>

<rect class="bg" x="0" y="0" width="1400" height="1000"/>

