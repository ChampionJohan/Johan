<text class="mono t3" x="1352" y="46" font-size="11.5" text-anchor="end">수요 4 · 코어 4 · 공급 6단계 · 확장 1</text>
<text class="mono gold" x="1352" y="76" font-size="13" text-anchor="end">가맹비 0 · 연회비 RM 12,000 · 교재비</text>

