<style>
svg{
  --bg:#F1F3EE; --panel:#FAFBF8; --panel2:#E8ECE4;
  --ink:#16211C; --ink2:#3B4A43; --muted:#69766F; --line:#CFD8CB; --line2:#B9C4B6;
  --acc:#0B7350; --accsoft:#DFECE5; --gold:#C2861A; --goldsoft:#F4E9D4;
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme:dark){
  svg:root, :root:not([data-theme="light"]) svg{
    --bg:#101410; --panel:#171C17; --panel2:#1E241E;
    --ink:#E7EDE5; --ink2:#C4CEC3; --muted:#93A096; --line:#2E382F; --line2:#3E4A3F;
    --acc:#37A87F; --accsoft:#16291F; --gold:#B8862E; --goldsoft:#2A2213;
  }
}
:root[data-theme="dark"] svg{
  --bg:#101410; --panel:#171C17; --panel2:#1E241E;
  --ink:#E7EDE5; --ink2:#C4CEC3; --muted:#93A096; --line:#2E382F; --line2:#3E4A3F;
  --acc:#37A87F; --accsoft:#16291F; --gold:#B8862E; --goldsoft:#2A2213;
}
.bg{fill:var(--bg)} .panel{fill:var(--panel)} .panel2{fill:var(--panel2)}
.ln{stroke:var(--line);fill:none} .ln2{stroke:var(--line2);fill:none}
.t1{fill:var(--ink)} .t2{fill:var(--ink2)} .t3{fill:var(--muted)}
.acc{fill:var(--acc)} .accs{fill:var(--accsoft)} .gold{fill:var(--gold)}
.ser{font-family:'Gowun Batang','Nanum Myeongjo',Georgia,serif;font-weight:700}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.eyebrow{font-size:12px;letter-spacing:.14em;fill:var(--muted);font-family:'IBM Plex Mono',ui-monospace,monospace}
.stitle{font-size:20px;font-family:'Gowun Batang',Georgia,serif;font-weight:700;fill:var(--ink)}
</style>

