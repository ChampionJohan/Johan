<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayAh · 아파요 — Offline Medical Communication Card</title>
<meta name="description" content="Point and tap to tell a doctor where it hurts, in 10 languages. Works completely offline. A communication aid, not a diagnosis tool.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-apple-180.png">
<meta name="theme-color" content="#0e9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#f2f7f6; --card:#ffffff; --ink:#0f2320; --muted:#5c716d;
    --line:#dde8e5; --accent:#0e9488; --accent-strong:#0b7a70; --accent-soft:#e2f4f1;
    --hurt:#e14b3d; --hurt-soft:#fdeae7; --danger:#c9271b;
    --shadow:0 2px 10px rgba(15,35,32,.07); --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1817; --card:#152423; --ink:#eaf4f2; --muted:#9db5b0;
      --line:#263a37; --accent:#2bbfae; --accent-strong:#4dd6c5; --accent-soft:#17332f;
      --hurt:#ff7a68; --hurt-soft:#3a1f1b; --danger:#ff6a58;
      --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 14px 140px;}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:30; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; border-bottom:1px solid var(--line);
  }
  .head-top{max-width:560px; margin:0 auto; display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .brand{font-size:19px; font-weight:800; letter-spacing:-.02em; color:var(--accent-strong);}
  .tagline{font-size:11.5px; color:var(--muted); line-height:1.3;}
  .lang-bar{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:7px;}
  .lang-field{flex:1; min-width:0;}
  .lang-field label{display:block; font-size:10.5px; color:var(--muted); margin-bottom:2px; font-weight:600;}
  select, input[type="text"], input[type="number"]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--ink); font-size:15px; font-family:inherit;
  }
  .swap-btn{
    flex:0 0 auto; margin-top:14px; width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--accent-strong); font-size:17px; cursor:pointer;
  }
  .swap-btn:active{transform:scale(.93);}

  /* ---------- tabs ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0 6px;
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:9px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-size:13.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h2{font-size:14px; margin:0 0 11px; letter-spacing:-.01em;}
  .hint{font-size:12px; color:var(--muted); margin:0 0 10px;}

  /* ---------- chips ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:10px 13px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit; text-align:left;
    min-height:44px;
  }
  .chip .sub{display:block; font-size:11px; font-weight:500; color:var(--muted); line-height:1.25;}
  .chip .txt{display:block;}
  .chip.on{border-color:var(--hurt); background:var(--hurt-soft); color:var(--hurt);}
  .chip.on .sub{color:var(--hurt);}
  .chip.calm.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .chip.calm.on .sub{color:var(--accent-strong);}
  .chip:active{transform:scale(.97);}
  .chip .emo{font-size:19px; line-height:1;}

  /* ---------- body map ---------- */
  .view-toggle{display:flex; gap:6px; margin-bottom:8px;}
  .view-toggle button{
    flex:1; padding:8px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); color:var(--muted); font-weight:700; font-size:13.5px;
    cursor:pointer; font-family:inherit;
  }
  .view-toggle button.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .bodymap{display:flex; justify-content:center; padding:4px 0 2px;}
  .bodymap svg{width:100%; max-width:250px; height:auto; touch-action:manipulation;}
  .fig{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; stroke-linejoin:round;}
  .zone{fill:transparent; stroke:transparent; cursor:pointer;}
  .zone.on{fill:var(--hurt); fill-opacity:.62;}
  .side-label{font-size:11px; font-weight:800; fill:var(--muted);}

  /* ---------- pain slider ---------- */
  .pain-row{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .pain-face{font-size:34px; line-height:1;}
  .pain-num{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:56px;}
  input[type="range"]{width:100%; accent-color:var(--hurt); height:30px;}
  .scale-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--muted);}

  /* ---------- info form ---------- */
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:4px;}
  .field .note{font-size:11px; color:var(--muted); font-weight:500;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .check{display:flex; align-items:center; gap:9px; padding:10px; border:1.5px solid var(--line); border-radius:12px; cursor:pointer;}
  .check input{width:20px; height:20px; accent-color:var(--accent);}
  .privacy{
    display:flex; gap:8px; font-size:11.5px; color:var(--muted);
    background:var(--accent-soft); padding:10px 12px; border-radius:12px; margin-top:2px;
  }

  /* ---------- emergency ---------- */
  .sos{
    display:block; width:100%; text-align:center; text-decoration:none;
    background:var(--danger); color:#fff; font-size:19px; font-weight:800;
    padding:16px; border-radius:14px; margin-bottom:6px; border:none; font-family:inherit; cursor:pointer;
  }
  .sos small{display:block; font-size:12px; font-weight:600; opacity:.9; margin-top:2px;}
  .num-list{display:flex; flex-direction:column; gap:6px;}
  .num-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card);
  }
  .num-row .lbl{font-size:13.5px; font-weight:600;}
  .num-row .val{font-size:17px; font-weight:800; color:var(--danger); font-variant-numeric:tabular-nums;}
  .num-row .val small{font-size:11px; color:var(--muted); font-weight:600; display:block; text-align:right;}

  /* ---------- talk cards ---------- */
  .say{
    width:100%; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; font-family:inherit; margin-bottom:7px;
  }
  .say .big{display:block; font-size:16px; font-weight:700; line-height:1.35;}
  .say .small{display:block; font-size:12px; color:var(--muted); margin-top:3px;}
  .say:active{border-color:var(--accent);}
  .answer-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}

  /* ---------- footer bar ---------- */
  .footbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--card); border-top:1px solid var(--line);
    padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  }
  .footbar-inner{max-width:560px; margin:0 auto; display:flex; gap:8px;}
  .btn-main{
    flex:1; padding:15px; border-radius:14px; border:none; background:var(--accent); color:#fff;
    font-size:16.5px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn-main:disabled{background:var(--line); color:var(--muted); cursor:default;}
  .btn-ghost{
    flex:0 0 auto; padding:15px 15px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; font-family:inherit;
  }

  /* ---------- overlay card ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60; background:rgba(8,20,18,.62);
    display:none; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card); border-radius:20px; width:100%; max-width:520px;
    padding:20px; margin:auto 0; box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .sheet-lang{font-size:11.5px; font-weight:800; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.08em;}
  .sum-line{margin:0 0 13px;}
  .sum-line .k{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:1px;}
  .sum-line .v{display:block; font-size:20px; font-weight:700; line-height:1.35;}
  .sum-line.pain .v{color:var(--hurt);}
  .mirror{border-top:1px dashed var(--line); margin-top:16px; padding-top:14px;}
  .mirror .sum-line .v{font-size:14px; font-weight:600; color:var(--muted);}
  .disclaim{
    display:flex; gap:8px; font-size:11.5px; color:var(--muted); line-height:1.45;
    background:var(--bg); border-radius:12px; padding:11px 12px; margin-top:16px;
  }
  .sheet-close{
    width:100%; margin-top:14px; padding:14px; border-radius:14px; border:none;
    background:var(--accent); color:#fff; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:22px 10px;}

  .speak-btn{
    margin-top:10px; width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); color:var(--accent-strong); font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .speak-btn[hidden]{display:none;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="head-top">
    <span class="brand">SayAh</span>
    <span class="tagline" id="tagline"></span>
  </div>
  <div class="lang-bar">
    <div class="lang-field">
      <label id="lblMyLang" for="myLang"></label>
      <select id="myLang"></select>
    </div>
    <button class="swap-btn" id="swapLang" type="button" title="swap">⇄</button>
    <div class="lang-field">
      <label id="lblOtherLang" for="otherLang"></label>
      <select id="otherLang"></select>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="body" type="button" id="tabBody"></button>
    <button class="tab" data-tab="symptom" type="button" id="tabSymptom"></button>
    <button class="tab" data-tab="talk" type="button" id="tabTalk"></button>
    <button class="tab" data-tab="info" type="button" id="tabInfo"></button>
    <button class="tab" data-tab="sos" type="button" id="tabSos"></button>
  </nav>

  <!-- ============ WHERE ============ -->
  <section class="panel active" data-panel="body">
    <div class="card">
      <h2 id="hWhere"></h2>
      <div class="view-toggle">
        <button type="button" id="viewFront" class="active"></button>
        <button type="button" id="viewBack"></button>
      </div>
      <p class="hint" id="bodyHint"></p>
      <div class="bodymap" id="bodymap"></div>
    </div>
    <div class="card">
      <h2 id="hFace"></h2>
      <div class="chips" id="faceChips"></div>
    </div>
  </section>

  <!-- ============ SYMPTOMS ============ -->
  <section class="panel" data-panel="symptom">
    <div class="card">
      <h2 id="hSymptom"></h2>
      <div class="chips" id="symptomChips"></div>
    </div>
    <div class="card">
      <h2 id="hPain"></h2>
      <div class="pain-row">
        <span class="pain-face" id="painFace">🙂</span>
        <span class="pain-num" id="painNum">0</span>
      </div>
      <input type="range" id="painRange" min="0" max="10" step="1" value="0">
      <div class="scale-ends"><span id="painLow"></span><span id="painHigh"></span></div>
    </div>
    <div class="card">
      <h2 id="hDuration"></h2>
      <div class="chips" id="durationChips"></div>
    </div>
  </section>

  <!-- ============ TALK ============ -->
  <section class="panel" data-panel="talk">
    <div class="card">
      <h2 id="hPhrases"></h2>
      <p class="hint" id="phraseHint"></p>
      <div id="phraseList"></div>
    </div>
    <div class="card">
      <h2 id="hDoctor"></h2>
      <p class="hint" id="doctorHint"></p>
      <div id="doctorList"></div>
    </div>
    <div class="card">
      <h2 id="hAnswers"></h2>
      <div class="answer-grid" id="answerList"></div>
    </div>
  </section>

  <!-- ============ MY INFO ============ -->
  <section class="panel" data-panel="info">
    <div class="card">
      <h2 id="hInfo"></h2>
      <div class="field">
        <label for="fAllergy" id="lblAllergy"></label>
        <input type="text" id="fAllergy">
      </div>
      <div class="field">
        <label for="fMeds" id="lblMeds"></label>
        <input type="text" id="fMeds">
      </div>
      <div class="field">
        <label for="fCond" id="lblCond"></label>
        <input type="text" id="fCond">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="fBlood" id="lblBlood"></label>
          <select id="fBlood"></select>
        </div>
        <div class="field">
          <label for="fAge" id="lblAge"></label>
          <input type="number" id="fAge" min="0" max="120">
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="fPregnant">
        <span id="lblPregnant"></span>
      </label>
      <div class="privacy"><span>🔒</span><span id="privacyNote"></span></div>
    </div>
  </section>

  <!-- ============ SOS ============ -->
  <section class="panel" data-panel="sos">
    <div class="card">
      <h2 id="hNumbers"></h2>
      <div class="field">
        <label for="sosCountry" id="lblCountry"></label>
        <select id="sosCountry"></select>
      </div>
      <div class="num-list" id="numList"></div>
      <p class="hint" id="numNote" style="margin:10px 0 0;"></p>
    </div>
  </section>
</div>

<div class="footbar">
  <div class="footbar-inner">
    <button class="btn-main" id="showBtn" type="button"></button>
    <button class="btn-ghost" id="clearBtn" type="button">↺</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-lang" id="sheetLang"></div>
    <div id="sheetMain"></div>
    <button class="speak-btn" id="speakBtn" type="button" hidden></button>
    <div class="mirror" id="sheetMirror"></div>
    <div class="disclaim"><span>⚠️</span><span id="disclaimText"></span></div>
    <button class="sheet-close" id="sheetClose" type="button"></button>
  </div>
</div>

<script>
/* ==========================================================================
   SayAh — offline medical communication card.

   Design rules this file follows:
   - NOTHING leaves the device. No network calls at all, no analytics.
     Health details typed in "My info" live only in this browser's
     localStorage. That is the whole privacy story, and it is why an
     undocumented worker or a tourist can use this without risk.
   - This is a COMMUNICATION AID, never a diagnosis or treatment tool.
     No advice, no dosages, no triage decisions — just translation of
     what the patient already knows into words the clinician can read.
   - Vocabulary is deliberately everyday, not clinical. Simple words
     translate accurately and the patient can actually recognise them.
   ========================================================================== */

const LANGS = ["ko","en","zh","ja","vi","th","id","tl","es","ru"];
const LANG_NAMES = {
  ko:"한국어", en:"English", zh:"中文", ja:"日本語", vi:"Tiếng Việt",
  th:"ไทย", id:"Bahasa Indonesia", tl:"Filipino", es:"Español", ru:"Русский"
};
/* BCP-47 tags, used only for optional text-to-speech and the <html lang> hint. */
const LANG_LOCALE = {
  ko:"ko-KR", en:"en-US", zh:"zh-CN", ja:"ja-JP", vi:"vi-VN",
  th:"th-TH", id:"id-ID", tl:"fil-PH", es:"es-ES", ru:"ru-RU"
};

/* Translation helper: one pipe-separated string per phrase, in LANGS order.
   Compact enough to keep every language for a phrase on one line, which is
   what makes the table reviewable by a native speaker later. */
function T(s){
  const parts = s.split("|");
  const out = {};
  LANGS.forEach((l, i) => { out[l] = parts[i] !== undefined && parts[i] !== "" ? parts[i] : parts[1]; });
  return out;
}

/* ---------------------------------------------------------------- UI text */
const UI = {
  tagline:      T("말이 안 통해도, 아픈 곳은 전할 수 있게|Point, tap, be understood|语言不通也能说清哪里疼|言葉が通じなくても、痛みは伝わる|Không cùng ngôn ngữ vẫn nói được chỗ đau|สื่อสารอาการได้แม้พูดคนละภาษา|Tetap bisa menjelaskan sakit tanpa bahasa yang sama|Maipaliwanag ang sakit kahit magkaibang wika|Explica tu dolor sin hablar el idioma|Объясните боль без общего языка"),
  myLang:       T("내 언어|My language|我的语言|自分の言語|Ngôn ngữ của tôi|ภาษาของฉัน|Bahasa saya|Wika ko|Mi idioma|Мой язык"),
  otherLang:    T("상대 언어|Their language|对方语言|相手の言語|Ngôn ngữ của họ|ภาษาของอีกฝ่าย|Bahasa mereka|Wika nila|Su idioma|Их язык"),
  tabBody:      T("🧍 어디가|🧍 Where|🧍 哪里|🧍 どこ|🧍 Ở đâu|🧍 ตรงไหน|🧍 Di mana|🧍 Saan|🧍 Dónde|🧍 Где"),
  tabSymptom:   T("🤒 증상|🤒 Symptoms|🤒 症状|🤒 症状|🤒 Triệu chứng|🤒 อาการ|🤒 Gejala|🤒 Sintomas|🤒 Síntomas|🤒 Симптомы"),
  tabTalk:      T("💬 대화|💬 Talk|💬 对话|💬 会話|💬 Trò chuyện|💬 บทสนทนา|💬 Bicara|💬 Usapan|💬 Hablar|💬 Разговор"),
  tabInfo:      T("🪪 내 정보|🪪 My info|🪪 我的信息|🪪 私の情報|🪪 Thông tin|🪪 ข้อมูลของฉัน|🪪 Info saya|🪪 Info ko|🪪 Mis datos|🪪 Мои данные"),
  tabSos:       T("🚨 응급번호|🚨 Emergency|🚨 急救电话|🚨 緊急番号|🚨 Khẩn cấp|🚨 ฉุกเฉิน|🚨 Darurat|🚨 Emergency|🚨 Emergencia|🚨 Экстренно"),
  hWhere:       T("어디가 아픈가요?|Where does it hurt?|哪里疼？|どこが痛いですか？|Bạn đau ở đâu?|เจ็บตรงไหน|Di mana yang sakit?|Saan masakit?|¿Dónde le duele?|Где болит?"),
  hFace:        T("머리·얼굴 부위|Head and face|头部·面部|頭・顔|Đầu và mặt|ศีรษะและใบหน้า|Kepala dan wajah|Ulo at mukha|Cabeza y cara|Голова и лицо"),
  front:        T("앞모습|Front|正面|前|Mặt trước|ด้านหน้า|Depan|Harap|Frente|Спереди"),

function renderBodyMap(){
  const zones = bodyView === "front" ? FRONT_ZONES : BACK_ZONES;
  /* On the front view the figure faces you, so its right side is drawn on
     your left. On the back view you are behind it, so the sides line up. */
  const leftMarker  = bodyView === "front" ? t("sideR") : t("sideL");
  const rightMarker = bodyView === "front" ? t("sideL") : t("sideR");
  const zoneSvg = zones.map(([id, shape]) => {
    const on = selected.parts.has(id) ? " on" : "";
    return shape.replace(/^<(\w+)/, `<$1 class="zone${on}" data-part="${id}" role="button" tabindex="0"`);
  }).join("");
  $("bodymap").innerHTML = `
    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" aria-label="body map">
      <g class="fig">${SILHOUETTE}</g>
      <text class="side-label" x="14" y="76" text-anchor="start">${leftMarker}</text>
      <text class="side-label" x="186" y="76" text-anchor="end">${rightMarker}</text>
      ${zoneSvg}

}

/* ================================================== the summary card */
function selectedPartNames(langCode){
  return [...selected.parts].map(id => BODY[id][langCode]);
}
function selectedSymptomNames(langCode){
  return SYMPTOMS.filter(([id]) => selected.symptoms.has(id)).map(([, , label]) => label[langCode]);
}
function durationName(langCode){
  const d = DURATIONS.find(([id]) => id === selected.duration);
  return d ? d[1][langCode] : null;
}
function myInfo(){
  return {
    allergy: $("fAllergy").value.trim(),
    meds:    $("fMeds").value.trim(),
    cond:    $("fCond").value.trim(),
    blood:   $("fBlood").value,
    age:     $("fAge").value.trim(),
    pregnant:$("fPregnant").checked
  };
}
function hasSelection(){
  return selected.parts.size > 0 || selected.symptoms.size > 0;
}
/* Builds the list of {labelKey, value} rows for one language. */
function summaryRows(langCode){
  const info = myInfo();
  const rows = [];
  const parts = selectedPartNames(langCode);
  const symps = selectedSymptomNames(langCode);
  if(parts.length) rows.push(["sumWhere", parts.join(", "), false]);
  if(symps.length) rows.push(["sumSymptom", symps.join(", "), false]);
  if(selected.pain > 0) rows.push(["sumPain", `${selected.pain} / 10`, true]);
  const dur = durationName(langCode);
  if(dur) rows.push(["sumSince", dur, false]);
  if(info.allergy) rows.push(["sumAllergy", info.allergy, false]);
  if(info.meds)    rows.push(["sumMeds", info.meds, false]);
  if(info.cond)    rows.push(["sumCond", info.cond, false]);
  if(info.blood)   rows.push(["sumBlood", info.blood, false]);
  if(info.age)     rows.push(["sumAge", info.age, false]);
  if(info.pregnant) rows.push([null, UI.lblPregnant[langCode], false]);
  return rows;
}
function rowsHtml(langCode, rows){
  return rows.map(([key, value, isPain]) =>
    `<p class="sum-line${isPain ? " pain" : ""}">
       ${key ? `<span class="k">${UI[key][langCode]}</span>` : ""}
       <span class="v">${escapeHtml(value)}</span>
     </p>`
  ).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
}
function openSummary(){
  if(!hasSelection()){
    $("sheetLang").textContent = "";
    $("sheetMain").innerHTML = `<p class="empty">${t("emptyMsg")}</p>`;
    $("sheetMirror").innerHTML = "";
    $("speakBtn").hidden = true;
  }else{
    $("sheetLang").textContent = LANG_NAMES[otherLang];
    $("sheetMain").innerHTML = rowsHtml(otherLang, summaryRows(otherLang));
    $("sheetMirror").innerHTML =
      `<div class="sheet-lang" style="margin-bottom:8px;">${LANG_NAMES[myLang]}</div>` +
      rowsHtml(myLang, summaryRows(myLang));
    setupSpeak(summaryRows(otherLang).map(r => r[1]).join(". "), otherLang);
  }
  $("disclaimText").textContent = to("disclaimer") + " / " + t("disclaimer");
  $("sheetClose").textContent = t("close");
  $("overlay").classList.add("open");
}
/* Read-aloud is a bonus, not a promise: only offered when the device
   actually has a voice for that language, and it never blocks anything. */
function setupSpeak(text, langCode){
  const btn = $("speakBtn");
  btn.hidden = true;
  if(!("speechSynthesis" in window) || !text) return;
  const tag = LANG_LOCALE[langCode];
  const base = tag.split("-")[0];
  const voices = window.speechSynthesis.getVoices() || [];
  if(!voices.some(v => v.lang && v.lang.toLowerCase().startsWith(base))) return;
  btn.hidden = false;
  btn.textContent = t("speak");
  btn.onclick = () => {
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = tag;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }catch(e){ /* nothing to do; the text is on screen anyway */ }
  };
}
function showBig(text, sub){
  $("sheetLang").textContent = "";
  $("sheetMain").innerHTML =
    `<p class="sum-line"><span class="v" style="font-size:27px;">${escapeHtml(text)}</span></p>`;
  $("sheetMirror").innerHTML = `<p class="sum-line"><span class="v">${escapeHtml(sub)}</span></p>`;
  $("disclaimText").textContent = to("disclaimer") + " / " + t("disclaimer");
  $("sheetClose").textContent = t("close");
  setupSpeak(text, otherLang);
  $("overlay").classList.add("open");
}

/* ============================================== apply all static text */
function applyText(){
  document.documentElement.lang = myLang;
  $("tagline").textContent    = t("tagline");
  $("lblMyLang").textContent  = t("myLang");
  $("lblOtherLang").textContent = t("otherLang");
  $("tabBody").textContent    = t("tabBody");
  $("tabSymptom").textContent = t("tabSymptom");
  $("tabTalk").textContent    = t("tabTalk");
  $("tabInfo").textContent    = t("tabInfo");
  $("tabSos").textContent     = t("tabSos");
  $("hWhere").textContent     = t("hWhere");
  $("hFace").textContent      = t("hFace");
  $("viewFront").textContent  = t("front");
  $("viewBack").textContent   = t("back");
  $("hSymptom").textContent   = t("hSymptom");
  $("hPain").textContent      = t("hPain");
  $("painLow").textContent    = t("painLow");
  $("painHigh").textContent   = t("painHigh");
  $("hDuration").textContent  = t("hDuration");
  $("hPhrases").textContent   = t("hPhrases");
  $("phraseHint").textContent = t("phraseHint");
  $("hDoctor").textContent    = t("hDoctor");
  $("doctorHint").textContent = t("doctorHint");
  $("hAnswers").textContent   = t("hAnswers");
  $("hInfo").textContent      = t("hInfo");
  $("lblAllergy").textContent = t("lblAllergy");
  $("lblMeds").textContent    = t("lblMeds");
  $("lblCond").textContent    = t("lblCond");
  $("lblBlood").textContent   = t("lblBlood");
  $("lblAge").textContent     = t("lblAge");
  $("lblPregnant").textContent = t("lblPregnant");
  $("privacyNote").textContent = t("privacyNote");
  $("hNumbers").textContent   = t("hNumbers");
  $("lblCountry").textContent = t("lblCountry");
  $("numNote").textContent    = t("numNote");
  $("showBtn").textContent    = t("showBtn");

  const bloodSel = $("fBlood");
  const keepBlood = bloodSel.value;
  bloodSel.innerHTML = `<option value="">${t("unknown")}</option>` +
    BLOOD_TYPES.map(b => `<option value="${b}">${b}</option>`).join("");
  bloodSel.value = keepBlood;

  renderBodyMap();
  renderFaceChips();
  renderSymptomChips();
  renderDurationChips();
  renderTalk();
  renderNumbers();
}

/* =========================================================== wiring */
const PAIN_FACES = ["🙂","🙂","😐","😐","😕","😕","😣","😣","😖","😫","😱"];
function updatePain(){
  $("painNum").textContent = selected.pain;
  $("painFace").textContent = PAIN_FACES[selected.pain];
}

$("myLang").addEventListener("change", (e) => {
  myLang = e.target.value;
  lsSet(LS.my, myLang);
  applyText();
});
$("otherLang").addEventListener("change", (e) => {
  otherLang = e.target.value;
  lsSet(LS.other, otherLang);
  applyText();
});
$("swapLang").addEventListener("click", () => {
  const tmp = myLang; myLang = otherLang; otherLang = tmp;
  lsSet(LS.my, myLang); lsSet(LS.other, otherLang);
  $("myLang").value = myLang; $("otherLang").value = otherLang;
  applyText();
});

$("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  const name = btn.dataset.tab;
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.dataset.panel === name));
  window.scrollTo({ top:0, behavior:"smooth" });
});

$("viewFront").addEventListener("click", () => {
  bodyView = "front";
  $("viewFront").classList.add("active"); $("viewBack").classList.remove("active");
  renderBodyMap();
});
$("viewBack").addEventListener("click", () => {
  bodyView = "back";
  $("viewBack").classList.add("active"); $("viewFront").classList.remove("active");
  renderBodyMap();
});

function toggleBodyPart(id){
  if(selected.parts.has(id)) selected.parts.delete(id); else selected.parts.add(id);
  renderBodyMap();
  renderFaceChips();
}
$("bodymap").addEventListener("click", (e) => {
  const zone = e.target.closest("[data-part]");
  if(zone) toggleBodyPart(zone.dataset.part);
});
/* The zones are focusable and announced as buttons, so they have to answer
   to the keyboard too — this app is for people who are already struggling
   to make themselves understood, and some of them navigate by switch or
   keyboard rather than by touch. */
$("bodymap").addEventListener("keydown", (e) => {
  if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  const zone = e.target.closest && e.target.closest("[data-part]");
  if(!zone) return;
  e.preventDefault();
  const id = zone.dataset.part;
  toggleBodyPart(id);
  /* renderBodyMap() replaces the nodes, so move focus back to the same zone. */
  const again = $("bodymap").querySelector(`[data-part="${id}"]`);
  if(again && again.focus) again.focus();
});
$("faceChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  const id = chip.dataset.id;
  if(selected.parts.has(id)) selected.parts.delete(id); else selected.parts.add(id);
  renderFaceChips();
  renderBodyMap();
});
$("symptomChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  const id = chip.dataset.id;
  if(selected.symptoms.has(id)) selected.symptoms.delete(id); else selected.symptoms.add(id);
  renderSymptomChips();
});
$("durationChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  selected.duration = selected.duration === chip.dataset.id ? null : chip.dataset.id;
  renderDurationChips();
});
$("painRange").addEventListener("input", (e) => {
  selected.pain = Number(e.target.value);
  updatePain();
});

$("phraseList").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-say]");
  if(!btn) return;
  const p = PHRASES[Number(btn.dataset.say)];
  showBig(p[otherLang], p[myLang]);
});
$("doctorList").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-say]");
  if(!btn) return;
  const p = DOCTOR_Q[Number(btn.dataset.say)];
  /* They asked it, so show it big in MY language. */
  $("sheetLang").textContent = "";
  $("sheetMain").innerHTML = `<p class="sum-line"><span class="v" style="font-size:27px;">${escapeHtml(p[myLang])}</span></p>`;
  $("sheetMirror").innerHTML = `<p class="sum-line"><span class="v">${escapeHtml(p[otherLang])}</span></p>`;
  $("disclaimText").textContent = to("disclaimer") + " / " + t("disclaimer");
  $("sheetClose").textContent = t("close");
  setupSpeak(p[myLang], myLang);
  $("overlay").classList.add("open");
});
$("answerList").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-answer]");
  if(!btn) return;
  const p = ANSWERS[Number(btn.dataset.answer)];
  showBig(p[otherLang], p[myLang]);
});

$("showBtn").addEventListener("click", openSummary);
$("sheetClose").addEventListener("click", () => $("overlay").classList.remove("open"));
$("overlay").addEventListener("click", (e) => {
  if(e.target === $("overlay")) $("overlay").classList.remove("open");
});
$("clearBtn").addEventListener("click", () => {
  selected.parts.clear();
  selected.symptoms.clear();
  selected.duration = null;
  selected.pain = 0;
  $("painRange").value = 0;
  updatePain();
  renderBodyMap(); renderFaceChips(); renderSymptomChips(); renderDurationChips();
});

/* My info persists locally so it is already filled in when it matters. */
[["fAllergy", LS.allergy], ["fMeds", LS.meds], ["fCond", LS.cond], ["fAge", LS.age]]
  .forEach(([id, key]) => {
    const el = $(id);
    el.value = lsGet(key, "");
    el.addEventListener("input", () => lsSet(key, el.value));
  });
$("fBlood").addEventListener("change", () => lsSet(LS.blood, $("fBlood").value));
$("fPregnant").addEventListener("change", () => lsSet(LS.pregnant, $("fPregnant").checked ? "1" : "0"));
$("sosCountry").addEventListener("change", () => {
  lsSet(LS.country, $("sosCountry").value);
  renderNumbers();
});

/* ============================================================== boot */
fillLangSelects();
$("sosCountry").innerHTML = SOS_NUMBERS.map(([code, name]) =>
  `<option value="${code}">${name}</option>`).join("");
$("sosCountry").value = lsGet(LS.country, "KR");
$("fPregnant").checked = lsGet(LS.pregnant, "0") === "1";
applyText();
$("fBlood").value = lsGet(LS.blood, "");
updatePain();

/* Voices load asynchronously on some browsers; re-check once they arrive. */
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = () => { /* next open() picks them up */ };
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline cache is optional */ });
  });
}
</script>
