<title>cover3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
  html,body{margin:0;padding:0;width:2560px;height:4096px;background:#0c1520;overflow:hidden;}
  .cover{
    position:relative; width:2560px; height:4096px;
    background:
      radial-gradient(1400px 1400px at 50% 38%, #1c3548 0%, #101d2b 55%, #070d15 100%);
    font-family:"EB Garamond", Georgia, serif;
    color:#f2ecd9;
  }
  .stars{position:absolute; inset:0;}

  .series-banner{
    position:absolute; top:520px; left:50%; transform:translateX(-50%);
    width:2400px; text-align:center;
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size:118px; letter-spacing:0.075em; color:#f6efdd;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .series-rule{
    position:absolute; top:672px; left:50%; transform:translateX(-50%);
    width:300px; height:2px; background:linear-gradient(90deg, transparent, #d8bd85, transparent);
  }
  .book-tag{
    position:absolute; top:718px; left:50%; transform:translateX(-50%);
    letter-spacing:0.5em; font-size:27px; color:#d8bd85; text-transform:uppercase;
  }

  .ring{
    position:absolute; left:50%; top:1580px; transform:translate(-50%,-50%);
    width:1420px; height:1420px; border-radius:50%;
    border:6px solid rgba(230,196,120,0.55);
    box-shadow: 0 0 140px 10px rgba(230,196,120,0.10) inset, 0 0 60px rgba(230,196,120,0.10);
  }
  .ring::before{
    content:""; position:absolute; inset:65px; border-radius:50%;
    border:1.5px solid rgba(230,196,120,0.28);
  }
  .glyph{
    position:absolute; left:50%; top:1580px; transform:translate(-50%,-50%);
    color:rgba(242,236,217,0.92);
  }

  .kicker{
    position:absolute; top:2350px; left:50%; transform:translateX(-50%);
    letter-spacing:0.5em; font-size:26px; color:#8a95a3; text-transform:uppercase;
  }

  .title{
    position:absolute; top:2440px; left:50%; transform:translateX(-50%);
    width:2300px; text-align:center;
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size:172px; line-height:1.05; letter-spacing:0.005em; color:#f6efdd;
    text-shadow: 0 6px 40px rgba(0,0,0,0.55);
  }
  .rule{
    position:absolute; top:3070px; left:50%; transform:translateX(-50%);
    width:340px; height:2px; background:linear-gradient(90deg, transparent, #d8bd85, transparent);
  }
  .subtitle{
    position:absolute; top:3140px; left:50%; transform:translateX(-50%);
    font-size:44px; letter-spacing:0.06em; color:#c9bfa0; font-style:italic;
  }
  .verse{
    position:absolute; top:3420px; left:50%; transform:translateX(-50%);
    width:1900px; text-align:center; font-size:30px; line-height:1.55; color:#a9a08a;
    font-style:italic;
  }
  .author{
    position:absolute; top:3860px; left:50%; transform:translateX(-50%);
    font-size:50px; letter-spacing:0.25em; color:#e7dcb8; text-transform:uppercase;
  }
</style>
<div class="cover">
  <svg class="stars" width="2560" height="500" viewBox="0 0 2560 500">
    <g fill="#f2ecd9">
      <circle cx="180" cy="60" r="2.4" opacity="0.8"/>
      <circle cx="360" cy="140" r="1.6" opacity="0.5"/>
      <circle cx="520" cy="40" r="2" opacity="0.6"/>
      <circle cx="760" cy="110" r="1.8" opacity="0.55"/>
      <circle cx="980" cy="30" r="2.2" opacity="0.7"/>
      <circle cx="1180" cy="80" r="1.5" opacity="0.45"/>
      <circle cx="1420" cy="40" r="2" opacity="0.6"/>
      <circle cx="1640" cy="120" r="1.7" opacity="0.5"/>
      <circle cx="1860" cy="60" r="2.3" opacity="0.75"/>
      <circle cx="2080" cy="130" r="1.6" opacity="0.5"/>
      <circle cx="2280" cy="70" r="2" opacity="0.65"/>
      <circle cx="2420" cy="150" r="1.5" opacity="0.4"/>
      <circle cx="90" cy="220" r="1.3" opacity="0.35"/>
      <circle cx="2470" cy="230" r="1.3" opacity="0.35"/>
    </g>
  </svg>

  <div class="series-banner">LOOP CHRONICLES</div>
  <div class="series-rule"></div>
  <div class="book-tag">Book Three</div>

  <div class="ring"></div>

  <!-- Balance: tilted beam, two pans. A dashed arc of "turning" the beam cannot read. -->
  <svg class="glyph" width="1200" height="1100" viewBox="0 0 1200 1100">
    <!-- the turning the Scales cannot measure -->
    <path d="M600 200 A 330 330 0 1 1 330 380"
          fill="none" stroke="#d8bd85" stroke-width="2.5" opacity="0.22"
          stroke-dasharray="3 16" stroke-linecap="round"/>

    <!-- central column -->
    <line x1="600" y1="360" x2="600" y2="820" stroke="#d8bd85" stroke-width="5" opacity="0.6"/>
    <!-- fulcrum -->
    <path d="M600 352 L 566 404 L 634 404 Z" fill="#d8bd85" opacity="0.75"/>
    <!-- base -->
    <line x1="470" y1="820" x2="730" y2="820" stroke="#d8bd85" stroke-width="5" opacity="0.6"/>
    <line x1="510" y1="846" x2="690" y2="846" stroke="#d8bd85" stroke-width="2.5" opacity="0.35"/>

    <!-- beam, tilted: left low, right high -->
    <line x1="252" y1="470" x2="948" y2="330" stroke="#f2ecd9" stroke-width="5" opacity="0.85"/>

    <!-- left hanger + pan (heavy) -->
    <line x1="252" y1="470" x2="252" y2="596" stroke="#f2ecd9" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="252" cy="606" rx="152" ry="34" fill="none" stroke="#f2ecd9" stroke-width="4" opacity="0.8"/>
    <ellipse cx="252" cy="606" rx="96" ry="21" fill="none" stroke="#f2ecd9" stroke-width="2" opacity="0.28"/>

    <!-- right hanger + pan (light, empty) -->
    <line x1="948" y1="330" x2="948" y2="456" stroke="#f2ecd9" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="948" cy="466" rx="152" ry="34" fill="none" stroke="#f2ecd9" stroke-width="4" opacity="0.8"/>
    <ellipse cx="948" cy="466" rx="96" ry="21" fill="none" stroke="#f2ecd9" stroke-width="2" opacity="0.28"/>

    <!-- weight resting in the low pan -->
    <path d="M214 576 L 290 576 L 302 596 L 202 596 Z" fill="#f2ecd9" opacity="0.88"/>
  </svg>

  <div class="kicker">A NOVEL</div>

  <div class="title">THE<br>FORTY&#8209;DAY<br>CLAUSE</div>
  <div class="rule"></div>
  <div class="subtitle">a novel that begins at Jonah 4</div>

  <div class="verse">&ldquo;I knew that thou art a gracious God, and merciful,<br>slow to anger, and of great kindness,<br>and repentest thee of the evil.&rdquo;</div>
  <div class="author">JOHAN CHOI</div>
</div>
