<title>cover7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
  html,body{margin:0;padding:0;width:2560px;height:4096px;background:#0c1520;overflow:hidden;}
  .cover{
    position:relative; width:2560px; height:4096px;
    background:
      radial-gradient(1400px 1400px at 50% 38%, #1c3548 0%, #101d2b 55%, #070d15 100%);
    font-family:"EB Garamond", Georgia, serif;
    color:#f2ecd9;
  }
  .stars{position:absolute; inset:0;}

  .series-banner{
    position:absolute; top:520px; left:50%; transform:translateX(-50%);
    width:2400px; text-align:center;
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size:118px; letter-spacing:0.075em; color:#f6efdd;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .series-rule{
    position:absolute; top:672px; left:50%; transform:translateX(-50%);
    width:300px; height:2px; background:linear-gradient(90deg, transparent, #d8bd85, transparent);
  }
  .book-tag{
    position:absolute; top:718px; left:50%; transform:translateX(-50%);
    letter-spacing:0.38em; font-size:26px; color:#d8bd85; text-transform:uppercase;
  }

  .ring{
    position:absolute; left:50%; top:1580px; transform:translate(-50%,-50%);
    width:1420px; height:1420px; border-radius:50%;
    border:6px solid rgba(230,196,120,0.55);
    box-shadow: 0 0 140px 10px rgba(230,196,120,0.10) inset, 0 0 60px rgba(230,196,120,0.10);
  }
  .ring::before{
    content:""; position:absolute; inset:65px; border-radius:50%;
    border:1.5px solid rgba(230,196,120,0.28);
  }
  .glyph{
    position:absolute; left:50%; top:1580px; transform:translate(-50%,-50%);
    color:rgba(242,236,217,0.92);
  }

  .kicker{
    position:absolute; top:2350px; left:50%; transform:translateX(-50%);
    letter-spacing:0.5em; font-size:26px; color:#8a95a3; text-transform:uppercase;
  }

  .title{
    position:absolute; top:2440px; left:50%; transform:translateX(-50%);
    width:2300px; text-align:center;
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size:186px; line-height:1.05; letter-spacing:0.005em; color:#f6efdd;
    text-shadow: 0 6px 40px rgba(0,0,0,0.55);
  }
  .rule{
    position:absolute; top:2900px; left:50%; transform:translateX(-50%);
    width:340px; height:2px; background:linear-gradient(90deg, transparent, #d8bd85, transparent);
  }
  .subtitle{
    position:absolute; top:2970px; left:50%; transform:translateX(-50%);
    font-size:44px; letter-spacing:0.06em; color:#c9bfa0; font-style:italic;
  }
  .verse{
    position:absolute; top:3330px; left:50%; transform:translateX(-50%);
    width:1900px; text-align:center; font-size:32px; line-height:1.55; color:#a9a08a;
    font-style:italic;
  }
  .author{
    position:absolute; top:3860px; left:50%; transform:translateX(-50%);
    font-size:50px; letter-spacing:0.25em; color:#e7dcb8; text-transform:uppercase;
  }
</style>
<div class="cover">
  <svg class="stars" width="2560" height="500" viewBox="0 0 2560 500">
    <g fill="#f2ecd9">
      <circle cx="180" cy="60" r="2.4" opacity="0.8"/>
      <circle cx="360" cy="140" r="1.6" opacity="0.5"/>
      <circle cx="520" cy="40" r="2" opacity="0.6"/>
      <circle cx="760" cy="110" r="1.8" opacity="0.55"/>
      <circle cx="980" cy="30" r="2.2" opacity="0.7"/>
      <circle cx="1180" cy="80" r="1.5" opacity="0.45"/>
      <circle cx="1420" cy="40" r="2" opacity="0.6"/>
      <circle cx="1640" cy="120" r="1.7" opacity="0.5"/>
      <circle cx="1860" cy="60" r="2.3" opacity="0.75"/>
      <circle cx="2080" cy="130" r="1.6" opacity="0.5"/>
      <circle cx="2280" cy="70" r="2" opacity="0.65"/>
      <circle cx="2420" cy="150" r="1.5" opacity="0.4"/>
      <circle cx="90" cy="220" r="1.3" opacity="0.35"/>
      <circle cx="2470" cy="230" r="1.3" opacity="0.35"/>
    </g>
  </svg>

  <div class="series-banner">LOOP CHRONICLES</div>
  <div class="series-rule"></div>
  <div class="book-tag">Book Seven · The Finale</div>

  <div class="ring"></div>

  <!-- Seven rooms in one plan, and the last one standing open.
       A water line runs through them all. -->
  <svg class="glyph" width="890" height="920" viewBox="86 100 600 620">

    <!-- the outer wall of the one house -->
    <rect x="130" y="150" width="540" height="500" rx="4"
          fill="none" stroke="#d8bd85" stroke-width="5" opacity="0.55"/>

    <!-- interior walls: seven rooms -->
    <g stroke="#d8bd85" stroke-width="3" opacity="0.4">
      <line x1="310" y1="150" x2="310" y2="400"/>
      <line x1="490" y1="150" x2="490" y2="400"/>
      <line x1="130" y1="400" x2="670" y2="400"/>
      <line x1="265" y1="400" x2="265" y2="650"/>
      <line x1="400" y1="400" x2="400" y2="650"/>
      <line x1="535" y1="400" x2="535" y2="650"/>
    </g>

    <!-- faint dimension ticks, like a real plan -->
    <g stroke="#d8bd85" stroke-width="1.6" opacity="0.2">
      <line x1="130" y1="126" x2="130" y2="142"/>
      <line x1="670" y1="126" x2="670" y2="142"/>
      <line x1="130" y1="134" x2="670" y2="134"/>
      <line x1="104" y1="150" x2="120" y2="150"/>
      <line x1="104" y1="650" x2="120" y2="650"/>
      <line x1="112" y1="150" x2="112" y2="650"/>
    </g>

    <!-- doorways: a gap in each wall, drawn as a swing arc -->
    <g stroke="#f2ecd9" stroke-width="3" opacity="0.5" fill="none">
      <path d="M310 250 A 34 34 0 0 1 344 284"/>
      <path d="M490 250 A 34 34 0 0 1 524 284"/>
      <path d="M265 490 A 34 34 0 0 1 299 524"/>
      <path d="M400 490 A 34 34 0 0 1 434 524"/>
    </g>

    <!-- the water, running through every room -->
    <path d="M130 545 C 230 538, 300 556, 400 548 C 500 540, 580 556, 670 549"
          fill="none" stroke="#9fc4dc" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
    <path d="M130 545 C 230 538, 300 556, 400 548 C 500 540, 580 556, 670 549"
          fill="none" stroke="#dff0fa" stroke-width="1.6" opacity="0.35" stroke-linecap="round"/>

    <!-- the last room: its door stands open, and the opening is the brightest mark -->
    <g>
      <line x1="535" y1="490" x2="535" y2="650" stroke="#0e1b28" stroke-width="9"/>
      <path d="M535 512 A 46 46 0 0 1 581 558"
            fill="none" stroke="#e6c478" stroke-width="4.5" opacity="0.95"/>
      <line x1="535" y1="512" x2="535" y2="466" stroke="#e6c478"
            stroke-width="6" opacity="0.95" stroke-linecap="round"/>
    </g>

    <!-- a hand-written line in the margin -->
    <g stroke="#f2ecd9" stroke-width="2.4" opacity="0.32" stroke-linecap="round">
      <line x1="146" y1="686" x2="286" y2="684"/>
      <line x1="146" y1="702" x2="238" y2="700"/>
    </g>
  </svg>

  <div class="kicker">A NOVEL</div>

  <div class="title">THE<br>LAST ROOM</div>
  <div class="rule"></div>
  <div class="subtitle">a novel that begins at Daniel 12:4</div>

  <div class="verse">&ldquo;Shut up the words, and seal the book,<br>even to the time of the end.&rdquo;</div>
  <div class="author">JOHAN CHOI</div>
</div>
