name: today-bread

# 사용 방법: 매일 묵상 화면을 캡처해 Claude 대화창에 올리면, Claude 가 영어 글을 써서
# threads/bread/queue/YYYY-MM-DD.txt 로 push 한다 → 이 워크플로가 바로 Threads(jo.han.im)에 게시한다.
on:
  push:
    branches: ["main", "claude/**"]
    paths: ["threads/bread/queue/*.txt"]
  workflow_dispatch:
    inputs:
      mode:
        description: "queue = 캡처로 만든 대기 글 게시 / auto = 묵상 사이트를 직접 읽어 요약(ANTHROPIC_API_KEY 필요)"
        type: choice
        options: [queue, auto]
        default: queue
      dry_run:
        description: "게시하지 않고 내용만 출력"
        type: boolean
        default: true

permissions:
  contents: write   # 게시 기록(state.json, posts/) 커밋

concurrency:
  group: today-bread
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_BREAD_ACCESS_TOKEN: ${{ secrets.THREADS_BREAD_ACCESS_TOKEN }}
          THREADS_BREAD_USER_ID: ${{ secrets.THREADS_BREAD_USER_ID }}
          MODE: ${{ inputs.mode || 'queue' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -z "$THREADS_BREAD_ACCESS_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::THREADS_BREAD_ACCESS_TOKEN 시크릿이 없어 게시할 수 없습니다. threads/bread/README.md 설정을 마무리하세요."
            exit 1
          fi
          if [ "$MODE" = "auto" ]; then
            pip install -q "anthropic>=2.12"
            python3 threads/bread/daily_bread.py "${args[@]}"
          else
            python3 threads/bread/daily_bread.py --queue "${args[@]}"
          fi

      - name: 게시 기록 커밋
        if: always()
        run: |
          git add -A threads/bread
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "today-bread: 게시 기록 갱신"
          git push
