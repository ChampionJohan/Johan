name: weekly-video

# 매주 월요일 09:00 KST(=00:00 UTC) 에 다음 편 대본 뼈대와 그래픽을 만들고,
# 그 주에 할 일을 이슈로 띄운다. 사람이 채울 것은 리서치와 숫자뿐이다.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      title:
        description: "큐 대신 직접 지정할 제목 (비우면 큐에서 다음 편)"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 큐 확인
        id: queue
        run: |
          python3 tools/new_video.py --peek | tee peek.txt
          echo "left=$(sed -n 's/^남은 편수: //p' peek.txt)" >> "$GITHUB_OUTPUT"
          echo "title=$(sed -n 's/^다음 편: //p' peek.txt)" >> "$GITHUB_OUTPUT"
          echo "category=$(sed -n 's/^카테고리: //p' peek.txt)" >> "$GITHUB_OUTPUT"
          echo "angle=$(sed -n 's/^각도: //p' peek.txt)" >> "$GITHUB_OUTPUT"

      - name: 큐가 비었으면 알리고 끝낸다
        if: steps.queue.outputs.left == ''
        run: |
          gh issue create \
            --title "편성 큐가 비었습니다" \
            --body "$(printf 'video/plan.md 5절에 `- [ ] 제목 | 카테고리 | 각도` 형식으로 다음 사이클을 채워 주세요.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')"
          echo "큐가 비어 이번 주는 건너뜁니다."
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 대본 뼈대 생성
        if: steps.queue.outputs.left != ''
        run: python3 tools/new_video.py ${{ inputs.title && format('"{0}"', inputs.title) || '' }}

      - name: 그래픽 생성
        if: steps.queue.outputs.left != ''
        run: python3 tools/video_assets.py --latest

      - name: 커밋
        if: steps.queue.outputs.left != ''
        id: commit
        run: |
          path=$(git -c core.quotepath=false status --porcelain video/scripts | sed -n 's/^?? //p' | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/
          if git diff --cached --quiet; then
            echo "새로 만들어진 파일이 없습니다."
            echo "path=$path" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "주간 대본 뼈대: ${{ steps.queue.outputs.title }}"
          for delay in 2 4 8 16; do
            git push && break || sleep "$delay"
          done
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: 이번 주 할 일 이슈 발행
        if: steps.queue.outputs.left != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.queue.outputs.title }}
          CATEGORY: ${{ steps.queue.outputs.category }}
          ANGLE: ${{ steps.queue.outputs.angle }}
          SCRIPT: ${{ steps.commit.outputs.path }}
          LEFT: ${{ steps.queue.outputs.left }}
        run: |
          body=$(cat <<EOF
          **$CATEGORY** · $ANGLE

          대본: \`$SCRIPT\`
          그래픽: \`video/assets/\` (썸네일 · BM 5칸 · 구간 카드). 5칸을 채우고 다시 돌리면 그래픽에 내용이 박힙니다.

          자동화가 끝난 지점은 여기까지입니다. 아래는 사람이 합니다.

          - [ ] **월** 리서치. 1차 출처 3개 이상, 숫자에 연도 붙이기 (2h)
          - [ ] **화** 대본 3,000~3,400자. TODO 없이 끝까지 (2h)
          - [ ] **수** 나레이션 녹음 + 자막 (1h)
          - [ ] **목** 편집. 자체 그래픽 먼저, B롤은 빈칸 메우기 (3h)
          - [ ] **금** 썸네일 문구를 front matter \`thumb:\` 에 넣고 \`video_assets.py\` 재실행 → 예약 업로드 (1h)
          - [ ] **토** 같은 대본에서 숏폼 3편 잘라내기 (1.5h)

          끝나면:
          \`\`\`
          # front matter 의 status 를 ready 로 바꾼 뒤
          python3 tools/video_assets.py --latest
          python3 tools/video_export.py
          \`\`\`

          큐에 $LEFT 편 남았습니다.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          gh issue create --title "이번 주 영상: $TITLE" --body "$body"

      - name: 큐가 얼마 안 남았으면 경고
        if: steps.queue.outputs.left != '' && fromJSON(steps.queue.outputs.left || '0') < 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "편성 큐 ${{ steps.queue.outputs.left }}편 남음" \
            --body "$(printf 'video/plan.md 에 다음 사이클 9편을 채워 주세요.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')"
