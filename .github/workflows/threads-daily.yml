name: threads-daily

# 매일 한국 시간 오전 8시 30분에 올리고, 늦게 도착하는 경우를 대비해 11시 3분까지 30분 간격으로 6번 시도한다.
# (UTC 23:30, 00:03, 00:33, 01:03, 01:33, 02:03 = KST 08:30, 09:03, 09:33, 10:03, 10:33, 11:03)
# GitHub 예약 실행은 부하가 크면 수 시간 늦어지거나 건너뛰어지므로, 한 번이라도 도착하면 올라가도록 여러 번 둔다.
# 마지막 게시 후 18시간이 지나지 않았다면 post_threads.py 가 건너뛰어 같은 날 중복 게시되지 않는다.
# 주의: schedule 트리거는 저장소의 "기본 브랜치"에 이 파일이 있어야 동작한다.
on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "3 0 * * *"
    - cron: "33 0 * * *"
    - cron: "3 1 * * *"
    - cron: "33 1 * * *"
    - cron: "3 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 내용만 출력 (처음에는 체크 유지)"
        type: boolean
        default: true
      post:
        description: "특정 글만 처리 (예: 001). 비우면 대기열의 다음 글"
        type: string
        default: ""

permissions:
  contents: write   # state.json 을 갱신해 커밋하기 위함

concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 글 점검 (글자 수)
        run: |
          python3 threads/post_threads.py --check-all
          python3 threads/post_threads.py --list

      - name: 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST_NAME: ${{ inputs.post }}
        run: |
          # 토큰을 아직 등록하지 않았다면 실패 대신 경고만 남기고 건너뛴다 (설정 전 빨간 X 방지)
          if [ -z "$THREADS_ACCESS_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::THREADS_ACCESS_TOKEN 시크릿이 아직 없어 게시를 건너뜁니다. threads/README.md 의 설정을 마무리하세요."
            exit 0
          fi
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$POST_NAME" ]; then args+=(--file "$POST_NAME"); fi
          python3 threads/post_threads.py "${args[@]}"

      - name: 진행 상태(state.json) 커밋
        if: always()   # 게시가 중간에 실패해도 어디까지 올렸는지는 저장해 다음에 이어서 올린다
        run: |
          if git diff --quiet -- threads/state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/state.json
          git commit -m "threads: 게시 진행 상태 갱신"
          git push
